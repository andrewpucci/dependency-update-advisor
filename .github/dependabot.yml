version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: '09:00'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 3
    labels:
      - dependencies
    assignees:
      - andrewpucci
    # Keep manifest ranges stable when they already admit the new release;
    # Dependabot still updates the lockfile/resolved version.
    versioning-strategy: increase-if-necessary
    # @types/node majors track the Node runtime, which stays on 24 while
    # engines.node is pinned to >=24.11.0 <25. Block new major PRs until the
    # runtime is upgraded and this ignore is removed.
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      npm-development-minor-patch:
        dependency-type: development
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      npm-security-development:
        applies-to: security-updates
        dependency-type: development
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: '09:00'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    assignees:
      - andrewpucci
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - '*'
      github-actions-security:
        applies-to: security-updates
        patterns:
          - '*'
